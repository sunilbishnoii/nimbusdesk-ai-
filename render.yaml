services:
  - type: web
    name: nimbusdesk-lead-ai
    runtime: python
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm install && npm run build:backend && cd .. && pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
